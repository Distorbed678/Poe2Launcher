# DepotDownloader (https://github.com/SteamRE/DepotDownloader), the self-contained build: no
# .NET install needed. The launcher downloads the asset for the host into
# <data>/tools/depotdownloader-<version>/ and refuses it unless its SHA-256 matches.
#
# Checksums measured on the release assets of tag DepotDownloader_3.4.0 (2025-05-09).
version = "3.4.0"
url_template = "https://github.com/SteamRE/DepotDownloader/releases/download/DepotDownloader_{version}/{asset}"

[[assets]]
os = "linux"
arch = "x86_64"
asset = "DepotDownloader-linux-x64.zip"
sha256 = "a999dec66b4850fc961bd50366696d23c2d0fad7b18790e6a5647b2f19097a53"
size = 33442357
exe = "DepotDownloader"

